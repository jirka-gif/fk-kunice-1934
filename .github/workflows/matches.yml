# Stažení zápasů z fotbal.cz → návrhy do administrace FK Kunice.
# Běží 4× týdně (středa, pátek, sobota, neděle) a po ručním spuštění.
# Playwright potřebuje skutečný prohlížeč, proto GitHub Actions a ne webový
# kontejner — do jeho obrazu se prohlížeč schválně nedává.
name: Zápasy z fotbal.cz

on:
  schedule:
    # čas je v UTC; 5:30 UTC ≈ 7:30 v létě / 6:30 v zimě
    - cron: '30 5 * * 3,5,6,0'
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalace závislostí
        run: npm ci

      - name: Instalace prohlížeče pro Playwright
        run: npx playwright install --with-deps chromium

      - name: Stažení zápasů a odeslání návrhů
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          MATCHES_TOKEN: ${{ secrets.MATCHES_TOKEN }}
          TEAM_NAME: ${{ vars.TEAM_NAME || 'Kunice' }}
        run: node scripts/scrape-matches.mjs

      # Když stahování spadne, založí se (nebo se aktualizuje) issue —
      # správce webu tak ví, že se formát stránky nejspíš změnil.
      - name: Upozornit na selhání
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Stahování zápasů z fotbal.cz selhalo';
            const body = [
              'Automatické stažení zápasů skončilo chybou.',
              '',
              `Běh: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Nejčastější příčina: fotbal.cz změnil formát stránky nebo požadavek zablokoval.',
              'Zkontroluj parser ve `scripts/parse-fotbal.mjs` a vzorek v `tests/fixtures/`.',
              'Web mezitím ukazuje poslední ručně potvrzená data — nic se nerozbilo.',
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'scraper',
            });
            const found = existing.data.find((i) => i.title === title);
            if (found) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: found.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['scraper'],
              });
            }
