# FK Kunice 1934 — nasazení do nethost clusteru (frankee-dev).
#
# Cluster:   ~/.kube/frankee-dev-config, context client-admin@frankee-dev
# Namespace: fk-kunice (vlastní, oddělený od frenkee-web-prod i insurecrm)
# Doména:    www.fkkunice.cz + fkkunice.cz
#
# Obraz je na GHCR VEŘEJNÝ, proto tu není imagePullSecret — stejně jako
# frenkee-web. Kdyby se balíček přepnul na private, je potřeba do namespace
# zkopírovat secret `ghcr-pull` a doplnit ho níže.
#
# Namespace `fk-kunice` tu NENÍ. Zakládá ho správce clusteru spolu s účtem
# (viz `bara-rbac.yaml`), protože účet, který sem nasazuje, na namespacy
# schválně nedosáhne. Kdyby byl tady, `apply` by skončil hláškou
#   namespaces "fk-kunice" is forbidden: ... cannot patch resource "namespaces"
# a to až PO tom, co se Deployment, Service i Ingress povedly — vypadalo by
# to jako neúspěch, i když web mezitím naběhl.
#
# Secret `fk-kunice-secrets` tu SCHVÁLNĚ NENÍ. Kdyby tu byl jako vzor s
# hodnotami typu „zmen-me", každé opakované `apply -f` tohoto souboru by
# přepsalo skutečná hesla zpátky na vzor a shodilo administraci. Secret se
# proto zakládá zvlášť příkazem — viz krok 2 v k8s/README.md.
#
# Deployment ho níže čte přes envFrom; bez něj poběží pod v CreateContainerConfigError.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fk-kunice
  namespace: fk-kunice
spec:
  replicas: 1
  selector:
    matchLabels: { app: fk-kunice }
  template:
    metadata:
      labels: { app: fk-kunice }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          # Tag doplní nasazovací příkaz. `latest` schválně NE — z něj nepoznáš,
          # co běží, protože se přepisuje.
          image: ghcr.io/jirka-gif/fk-kunice-1934:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ['ALL'] }
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: fk-kunice-secrets
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: '3000'
            # Next standalone poslouchá na adrese z HOSTNAME. Když ji nikdo
            # nenastaví, převezme jméno podu a web odpovídá jen na IP podu:
            # `kubectl port-forward` (krok 5 návodu) skončí chybou spojení,
            # i když v logu stojí „Ready". Ověřeno smoke testem v clusteru.
            # Obraz už správnou hodnotu má; tady je zopakovaná proto, aby
            # byla vidět i tomu, kdo čte jen tenhle soubor.
            - name: HOSTNAME
              value: '0.0.0.0'
            # Připojení k vlastnímu Postgresu v clusteru. Secret zakládá
            # operátor CloudNativePG sám, když se použije `postgres.yaml` —
            # heslo tak nikdy neprochází přes schránku ani ruční příkaz.
            #
            # `optional: true` znamená: dokud vlastní databáze neexistuje, pod
            # normálně naběhne a použije se DATABASE_URL z `fk-kunice-secrets`
            # (tam se dává adresa hostované Neon databáze).
            #
            # Pozor na pořadí: `env` PŘEBÍJÍ `envFrom`. Jakmile tedy vlastní
            # databáze vznikne, web se po restartu přepne na ni, i kdyby v
            # secretu zůstala stará adresa na Neon. To je záměr — přepnutí se
            # dělá založením databáze, ne přepisováním hesel.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fk-kunice-db-app
                  key: uri
                  optional: true
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: '1', memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: fk-kunice
  namespace: fk-kunice
spec:
  selector: { app: fk-kunice }
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fk-kunice
  namespace: fk-kunice
  annotations:
    # Stejný issuer, jakým si certifikát bere frenkee-web.
    cert-manager.io/cluster-issuer: le-nethost-issuer
    # JEN anotace, `ingressClassName` schválně NE. Řadič v tomhle clusteru
    # jede ve starším režimu (`--ingress-class`) a ingress s vyplněným
    # `spec.ingressClassName` si nevezme — ověřeno: ingress zůstal bez
    # adresy, bez událostí, a doména vracela 404, zatímco solver od
    # cert-manageru (jen anotace, žádné pole) adresu dostal.
    kubernetes.io/ingress.class: nginx
    # fkkunice.cz → www.fkkunice.cz. Bez tohohle by apex vracel obsah přímo
    # a Google by to viděl jako dvě stránky s týmž textem.
    nginx.ingress.kubernetes.io/from-to-www-redirect: 'true'
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
spec:
  tls:
    - hosts: [www.fkkunice.cz, fkkunice.cz]
      secretName: fk-kunice-tls
  rules:
    - host: www.fkkunice.cz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fk-kunice
                port: { number: 80 }
    - host: fkkunice.cz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fk-kunice
                port: { number: 80 }
