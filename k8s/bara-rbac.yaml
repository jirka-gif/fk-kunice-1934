# Účet pro Báru — plná práva, ale JEN v namespace `fk-kunice`.
#
# Cluster: ~/.kube/frankee-dev-config, context client-admin@frankee-dev
#
# Proč vlastní namespace a ne omezená práva v cizím: aby si mohla web
# vytvořit, měnit a rozbít bez toho, že se někoho zeptá — a zároveň se to
# nemohlo dotknout frenkee.cz, insurecrm ani ostatních věcí v clusteru.
# Vestavěná role `admin` jí v jejím namespace dovolí všechno: deploymenty,
# služby, ingressy, configmapy, secrety, `exec` do vlastních podů.
#
# Co NEUMÍ: nic mimo `fk-kunice`. Ani číst, ani měnit.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bara
  namespace: fk-kunice
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bara-admin
  namespace: fk-kunice
subjects:
  - kind: ServiceAccount
    name: bara
    namespace: fk-kunice
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  # Vestavěná role. Jako RoleBinding (ne ClusterRoleBinding) platí jen
  # v tomhle jednom namespace — to je celý rozdíl.
  name: admin
